maven.basedir=@project.basedir@
# database init, supports mysql too
#spring.datasource.schema=classpath*:db/${database}/schema.sql
spring.mvc.pathpattern.matching-strategy=ant_path_matcher

# Load local .env values when running Spring Boot directly (optional in CI/production)
spring.config.import=optional:file:.env[.properties]

# H2 Console (for development - access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:streetask
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.security.user.name=admin 
spring.security.user.password=admin
server.port=8080
# Web
spring.thymeleaf.mode=HTML
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Flyway is enabled in mysql/pre profiles; keep it disabled for default H2 test context.
spring.flyway.enabled=false

# Initialize data with H2-compatible data.sql
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql


# Internationalization
spring.messages.basename=messages/messages




# Actuator / Management
#management.endpoints.web.base-path=/manage
#management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE

# Maximum time static resources should be cached
spring.resources.cache.cachecontrol.max-age=12h

# App Properties
streetask.app.jwtSecret= streetaskSecretKey
#       Expiration set to 1 day 
streetask.app.jwtExpirationMs= 86400000 

# API Properties
api.version=1.0-SNAPSHOT
tos.uri=terms-of-service
api.server.url=I don't know
api.description=The API is used to ...
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Mail (Brevo SMTP)
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
streetask.mail.from=${BREVO_MAIL_FROM:streetask0@gmail.com}

# WebSocket
streetask.websocket.endpoint=/ws
streetask.websocket.allowed-origin-patterns=${STREETASK_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
streetask.websocket.zone.cell-size-degrees=0.02
streetask.websocket.topic.zone-prefix=/topic/zones
streetask.websocket.topic.zone-suffix=/notifications
streetask.websocket.topic.user-queue=/queue/notifications

# Web Push (VAPID)
streetask.web-push.subject=${STREETASK_WEB_PUSH_SUBJECT:mailto:streetask.notifications@gmail.com}
streetask.web-push.public-key=${STREETASK_WEB_PUSH_PUBLIC_KEY:BCzmM4oFvgyIoji531RyMjAMxwSEcgRHivSvGBtDeP93MssCAQdfnZZlZ-24mpUMGlCRselBYpHj1onx9eHwqcQ}
streetask.web-push.private-key=${STREETASK_WEB_PUSH_PRIVATE_KEY:xS6S6T2vAkW3mr43IsHOeb6J1DzkXA2AxcGn88z7uq8}

# Stripe
streetask.stripe.secret-key=${STRIPE_SECRET_KEY:}
streetask.stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
streetask.stripe.currency=${STRIPE_CURRENCY:eur}
streetask.stripe.subscription-amount-cents=${STRIPE_SUBSCRIPTION_AMOUNT_CENTS:1999}
streetask.stripe.regular-premium-amount-cents=${STRIPE_REGULAR_PREMIUM_AMOUNT_CENTS:299}

# Stripe checkout redirects (pre profile)
streetask.stripe.success-url=${STREETASK_STRIPE_SUCCESS_URL:${FRONTEND_URL:https://ppl-streetask.expo.app}}
streetask.stripe.cancel-url=${STREETASK_STRIPE_CANCEL_URL:${FRONTEND_URL:https://ppl-streetask.expo.app}}
streetask.stripe.streetcoins-success-url=${STREETASK_STRIPE_STREETCOINS_SUCCESS_URL:${FRONTEND_URL:https://ppl-streetask.expo.app}}
streetask.stripe.streetcoins-cancel-url=${STREETASK_STRIPE_STREETCOINS_CANCEL_URL:${FRONTEND_URL:https://streetask-preprod-frontend.onrender.com}}
streetask.stripe.allowed-return-origin-patterns=${STREETASK_STRIPE_ALLOWED_RETURN_ORIGIN_PATTERNS:https://ppl-streetask.expo.app,https://streetask-preprod-frontend.onrender.com,https://streetask.expo.app,https://sprint2-streetask.expo.app,https://sprint3-streetask.expo.app,http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://127.0.0.1:*}

# Answer reward balancing
streetask.coins.answer-reward.like-threshold=${STREETASK_ANSWER_REWARD_LIKE_THRESHOLD:3}
streetask.coins.answer-reward.amount=${STREETASK_ANSWER_REWARD_AMOUNT:15}
streetask.coins.purchase.mode=${STREETASK_COINS_PURCHASE_MODE:stripe}

# SendGrid (optional, alternative mail provider)
sendgrid.api-key=${SENDGRID_API_KEY:}
