# Database Configuration (Pre-Production - Render)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/streetask?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${MYSQL_USER:streetask}
spring.datasource.password=${MYSQL_PASSWORD:streetask}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.h2.console.enabled=false

# Wait for tables to be created before inserting data
spring.jpa.defer-datasource-initialization=false

# Use Flyway for schema versioning in pre.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Disable sql.init scripts to avoid conflicts with Flyway migrations.
spring.sql.init.mode=never

# CORS (HTTP + WebSocket) for local development and Render frontend
streetask.http.allowed-origin-patterns=${STREETASK_HTTP_ALLOWED_ORIGIN_PATTERNS:http://localhost:8080,http://localhost:8081,http://localhost:19006,https://streetask.expo.app,https://streetask-preprod-frontend.onrender.com, https://ppl-streetask.expo.app}
streetask.websocket.allowed-origin-patterns=${STREETASK_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://streetask-preprod-frontend.onrender.com}

# Stripe checkout redirects (pre profile)
streetask.stripe.success-url=${STREETASK_STRIPE_SUCCESS_URL:${FRONTEND_URL: https://ispp-g10-frontend-a5pq.onrender.com}}
streetask.stripe.cancel-url=${STREETASK_STRIPE_CANCEL_URL:${FRONTEND_URL: https://ispp-g10-frontend-a5pq.onrender.com}}
streetask.stripe.streetcoins-success-url=${STREETASK_STRIPE_STREETCOINS_SUCCESS_URL:${FRONTEND_URL: https://ispp-g10-frontend-a5pq.onrender.com}}
streetask.stripe.streetcoins-cancel-url=${STREETASK_STRIPE_STREETCOINS_CANCEL_URL:${FRONTEND_URL: https://ispp-g10-frontend-a5pq.onrender.com}}
streetask.stripe.allowed-return-origin-patterns=${STREETASK_STRIPE_ALLOWED_RETURN_ORIGIN_PATTERNS:https://ppl-streetask.expo.app,https://streetask-preprod-frontend.onrender.com,https://streetask.expo.app,https://sprint2-streetask.expo.app,https://sprint3-streetask.expo.app,http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://127.0.0.1:*}

